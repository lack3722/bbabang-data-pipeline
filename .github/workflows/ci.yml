name: BBABANG CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  test:
    name: Python CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project and test tools
        run: |
          pip install -e .
          pip install -r requirements-dev.txt

      - name: Check Python syntax
        run: python -m compileall -q src main.py

      - name: Ruff lint
        run: ruff check src tests main.py

      - name: Run unit tests
        run: pytest -q
